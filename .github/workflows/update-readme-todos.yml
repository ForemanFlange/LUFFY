name: Update README TODO list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-todos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Regenerate complete TODO list
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          heading_re = re.compile(r'^### .*Complete TODO List.*$', re.M)
          heading_match = heading_re.search(text)
          if not heading_match:
              raise SystemExit('Complete TODO List heading not found')

          contributing_re = re.compile(r'^## .*Contributing.*$', re.M)
          contributing_match = contributing_re.search(text, heading_match.end())
          if not contributing_match:
              raise SystemExit('Contributing section not found')

          before = text[:heading_match.end()]
          after = text[contributing_match.start():]
          old_block = text[heading_match.end():contributing_match.start()]

          entry_re = re.compile(r'^- \[ \] \*\*(?P<path>[^:*]+):(?P<line>\d+)\*\* - (?P<msg>.*)$')
          baseline_entries = []
          for raw_line in old_block.splitlines():
              match = entry_re.match(raw_line)
              if match:
                  baseline_entries.append({
                      'path': match.group('path'),
                      'line': int(match.group('line')),
                      'msg': match.group('msg'),
                  })

          diff_commands = [
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              ['git', 'diff', '--name-only', 'origin/main', 'HEAD'],
              ['git', 'show', '--pretty=format:', '--name-only', '7463fefd0f55ae2ba0b919e06527588022893495'],
              ['git', 'diff', '--name-only', 'HEAD~1..HEAD'],
          ]

          changed_files = []
          for diff_command in diff_commands:
              result = subprocess.run(diff_command, text=True, capture_output=True)
              print(f"DIFF_CMD={' '.join(diff_command)} RC={result.returncode}")
              print(f"DIFF_STDOUT={result.stdout[:1200]!r}")
              print(f"DIFF_STDERR={result.stderr[:500]!r}")
              if result.returncode != 0:
                  continue
              files = [
                  line.strip().replace('\\', '/')
                  for line in result.stdout.splitlines()
                  if line.strip().endswith('.py')
              ]
              if files:
                  changed_files = sorted(set(files))
                  break
          changed_set = set(changed_files)
          print(f"CHANGED_PY_FILES={changed_files}")

          todo_re = re.compile(r'#\s*TODO\b\s*(?P<rest>.*?)\s*$', re.IGNORECASE)

          def parse_python_file(path_str):
              path = Path(path_str)
              if not path.is_file():
                  print(f"MISSING_PY_FILE={path_str}")
                  return []
              parsed = []
              with path.open('r', encoding='utf-8', errors='replace') as handle:
                  for line_number, source_line in enumerate(handle, 1):
                      match = todo_re.search(source_line)
                      if not match:
                          continue
                      message = match.group('rest').strip()
                      message = re.sub(r'^:\s*', '', message)
                      message = re.sub(r'\s+', ' ', message).strip()
                      parsed.append({
                          'path': path_str,
                          'line': line_number,
                          'msg': message,
                      })
              return parsed

          python_files = sorted(
              str(path).replace('\\', '/')
              for path in Path('.').rglob('*.py')
              if '.git' not in path.parts
          )
          print(f"PY_FILE_COUNT={len(python_files)}")
          parsed_by_file = {path: parse_python_file(path) for path in python_files}

          final_entries = [
              entry for entry in baseline_entries
              if entry['path'] not in changed_set
          ]
          changed_entries = []
          for path in changed_files:
              parsed = parsed_by_file.get(path, parse_python_file(path))
              print(f"PARSED_CHANGED_FILE={path} TODO_COUNT={len(parsed)}")
              for entry in parsed:
                  print(f"CHANGED_TODO {entry['path']}:{entry['line']} {entry['msg']}")
              changed_entries.extend(parsed)
          final_entries.extend(changed_entries)

          seen = set()
          unique_entries = []
          for entry in final_entries:
              key = (entry['path'], entry['line'], entry['msg'])
              if key in seen:
                  continue
              seen.add(key)
              unique_entries.append(entry)

          unique_entries.sort(key=lambda entry: (entry['path'], entry['line'], entry['msg']))
          new_lines = [
              f"- [ ] **{entry['path']}:{entry['line']}** - {entry['msg']}"
              for entry in unique_entries
          ]
          new_text = before + '\n\n' + '\n'.join(new_lines) + '\n\n' + after

          if new_text != text:
              readme.write_text(new_text, encoding='utf-8')

          print(f'todo_count_before={len(baseline_entries)} todo_count_after={len(unique_entries)}')
          print(f"README_WOULD_CHANGE={new_text != text}")
          PY

      - name: Commit README update
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README TODO list"
          git push origin HEAD:dev
