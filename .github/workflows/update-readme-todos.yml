name: Update README TODO list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-todos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Regenerate complete TODO list
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          heading_re = re.compile(r'^### .*Complete TODO List.*$', re.M)
          heading_match = heading_re.search(text)
          if not heading_match:
              raise SystemExit('Complete TODO List heading not found')

          section_start = heading_match.end()
          next_re = re.compile(r'^## .*Contributing.*$', re.M)
          next_match = next_re.search(text, section_start)
          if not next_match:
              raise SystemExit('Contributing section not found')

          section_end = next_match.start()
          before = text[:section_start]
          after = text[section_end:]
          block = text[section_start:section_end]

          entry_re = re.compile(r'^- \[ \] \*\*(?P<path>[^:*]+):(?P<line>\d+)\*\* - (?P<msg>.*)$')
          entries = []
          for raw_line in block.splitlines():
              match = entry_re.match(raw_line)
              if match:
                  entries.append({
                      'path': match.group('path'),
                      'line': int(match.group('line')),
                      'msg': match.group('msg'),
                      'raw': raw_line,
                  })

          changed = []
          diff_commands = [
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              ['git', 'diff', '--name-only', 'HEAD~1..HEAD'],
          ]
          for diff_cmd in diff_commands:
              result = subprocess.run(diff_cmd, text=True, capture_output=True)
              if result.returncode == 0 and result.stdout.strip():
                  changed = [
                      line.strip().replace('\\', '/')
                      for line in result.stdout.splitlines()
                      if line.strip().endswith('.py')
                  ]
                  if changed:
                      break
          changed = sorted(set(changed))

          todo_re = re.compile(r'#\s*TODO(?:\s*\((?P<author>[^)]*)\))?\s*:?\s*(?P<msg>.*?)\s*$', re.I)

          def parse_py(path_str):
              items = []
              path = Path(path_str)
              if not path.exists():
                  return items
              with path.open('r', encoding='utf-8', errors='replace') as handle:
                  for line_no, source_line in enumerate(handle, 1):
                      match = todo_re.search(source_line)
                      if not match:
                          continue
                      author = (match.group('author') or '').strip()
                      msg = re.sub(r'\s+', ' ', match.group('msg')).strip()
                      if author:
                          message = f'({author})' + (f' {msg}' if msg else '')
                      else:
                          message = msg
                      items.append({'path': path_str, 'line': line_no, 'msg': message})
              return items

          changed_set = set(changed)
          updated = [entry for entry in entries if entry['path'] not in changed_set]
          for path_str in changed:
              updated.extend(parse_py(path_str))

          seen = set()
          deduped = []
          for entry in updated:
              key = (entry['path'], entry['line'], entry['msg'])
              if key in seen:
                  continue
              seen.add(key)
              deduped.append(entry)

          deduped.sort(key=lambda entry: (entry['path'], entry['line'], entry['msg']))
          new_lines = [
              f"- [ ] **{entry['path']}:{entry['line']}** - {entry['msg']}"
              for entry in deduped
          ]
          new_block = '\n\n' + '\n'.join(new_lines) + '\n\n'
          new_text = before + new_block + after

          if new_text != text:
              readme.write_text(new_text, encoding='utf-8')

          print(f'Changed Python files: {changed}')
          print(f'TODO entries before: {len(entries)}; after: {len(deduped)}')
          for entry in deduped:
              if entry['path'] in changed_set:
                  print(f"{entry['path']}:{entry['line']} - {entry['msg']}")
          PY

      - name: Commit README update
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README TODO list"
          git push origin HEAD:dev
